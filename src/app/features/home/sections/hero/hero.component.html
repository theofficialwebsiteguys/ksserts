<section class="hero">
  <div class="hero__texture" aria-hidden="true"></div>

  <img src="assets/cutouts/cutout-1.png" alt="" class="hero__cutout hero__cutout--1" loading="eager" />
  <img src="assets/cutouts/cutout-10.png" alt="" class="hero__cutout hero__cutout--2" loading="eager" />
  <img src="assets/cutouts/cutout-6.png" alt="" class="hero__cutout hero__cutout--3" loading="eager" />

  <div class="container hero__inner">
    <div class="hero__logo-wrap">
      <app-logo variant="lockup" theme="dark" [eager]="true" alt="K'sserts Cookie Café — sugar free, keto, gluten free, vegan. Handcrafted, inclusive, made with love." />
    </div>

    <h1 class="hero__headline text-balance">No One Left Out of Dessert.</h1>

    <p class="hero__subtext text-balance">
    At K’sserts Cookie Café, we craft irresistible cookies and desserts with real, high-quality ingredients, including gluten-free, vegan, and sugar-conscious options — because everyone deserves a seat at the table.
    </p>

    <div class="hero__ctas">
      <a routerLink="/shop" class="btn btn--primary">Shop K'sserts</a>
      <a routerLink="/our-story" class="btn btn--outline-dark">Our Story</a>
    </div>
  </div>
</section>
